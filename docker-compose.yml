services:
  web:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    ports:
      - 3000
    environment:
      - PORT=3000
      - BASE_PATH=${BASE_PATH:-/}
      - RUN_MIGRATIONS=true
      - ADAPTER_MODE=real
      - POSTGRES_URL=postgresql://rag:rag@postgres:5432/rag
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniopassword
      - MINIO_BUCKET=rag-documents
      - OPENAI_CHAT_MODEL=gpt-4o-mini
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - OPENAI_API_KEY=${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      - BOT_PROTECTION_ENABLED=${BOT_PROTECTION_ENABLED:-false}
      - BOT_TRUST_PROXY=${BOT_TRUST_PROXY:-true}
      - BOT_UPLOAD_MAX_BYTES=${BOT_UPLOAD_MAX_BYTES:-20971520}
      - BOT_RATE_LIMIT_WINDOW_MS=${BOT_RATE_LIMIT_WINDOW_MS:-60000}
      - BOT_PROJECT_CREATES_PER_WINDOW=${BOT_PROJECT_CREATES_PER_WINDOW:-15}
      - BOT_CHAT_CREATES_PER_WINDOW=${BOT_CHAT_CREATES_PER_WINDOW:-40}
      - BOT_MESSAGES_PER_WINDOW=${BOT_MESSAGES_PER_WINDOW:-80}
      - BOT_UPLOADS_PER_WINDOW=${BOT_UPLOADS_PER_WINDOW:-20}
      - BOT_EVAL_RUNS_PER_WINDOW=${BOT_EVAL_RUNS_PER_WINDOW:-10}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    command: ["npm", "run", "start:worker"]
    environment:
      - PORT=3001
      - BASE_PATH=${BASE_PATH:-/}
      - RUN_MIGRATIONS=false
      - ADAPTER_MODE=real
      - POSTGRES_URL=postgresql://rag:rag@postgres:5432/rag
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniopassword
      - MINIO_BUCKET=rag-documents
      - OPENAI_CHAT_MODEL=gpt-4o-mini
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - OPENAI_API_KEY=${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      - BOT_PROTECTION_ENABLED=${BOT_PROTECTION_ENABLED:-false}
      - BOT_UPLOAD_MAX_BYTES=${BOT_UPLOAD_MAX_BYTES:-20971520}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - 9000
      - 9001
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
